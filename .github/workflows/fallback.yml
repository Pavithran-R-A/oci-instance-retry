name: OCI Always Free Micro Fallback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fallback.yml"
      - "fallback.py"
      - "requirements.txt"
  schedule:
    - cron: "4/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oci-always-free-micro-fallback
  cancel-in-progress: false

jobs:
  claim-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check and claim free micro fallback
        id: fallback
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUB_KEY: ${{ secrets.OCI_SSH_PUB_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OCI_REGION: ap-hyderabad-1
          OCI_DISPLAY_NAME: vennila-oracle-vm
          OCI_FALLBACK_DISPLAY_NAME: vennila-oracle-micro
          START_JITTER_SECONDS: "15"
        run: python fallback.py

      - name: Stop fallback retries after a VPS exists
        if: steps.fallback.outputs.fallback_created == 'true' || steps.fallback.outputs.already_have_primary == 'true' || steps.fallback.outputs.already_have_fallback == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
