name: OCI Always Free A1 Claimer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/claim.yml"
      - "retry.py"
      - "requirements.txt"
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oci-always-free-a1-claimer
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check capacity and claim if available
        id: claim
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUB_KEY: ${{ secrets.OCI_SSH_PUB_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OCI_REGION: ap-hyderabad-1
          OCI_DISPLAY_NAME: vennila-oracle-vm
          START_JITTER_SECONDS: "15"
        run: python retry.py

      - name: Stop future retries after success
        if: steps.claim.outputs.claimed == 'true' || steps.claim.outputs.already_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
