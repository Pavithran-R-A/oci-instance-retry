name: OCI Instance Retry

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install oci requests

      - name: Run OCI retry
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUB_KEY: ${{ secrets.OCI_SSH_PUB_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python retry.py

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last run: $(date)" > last_run.txt
          git add last_run.txt
          git diff --staged --quiet || git commit -m "keep alive $(date)" && git push
